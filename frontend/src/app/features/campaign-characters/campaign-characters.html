<main class="characters-page">
  <header class="page-header">
    <div>
      <span class="eyebrow">Effectif de campagne</span>
      <h1>Personnages</h1>
      <p>
        Consulte les fiches et fais évoluer les personnages
        de la campagne.
      </p>
    </div>

    <a
      class="create-link"
      [routerLink]="[
        '/campaigns',
        campaignId,
        'characters',
        'new'
      ]"
    >
      + Créer un personnage
    </a>
  </header>

  @if (error()) {
    <p
      class="state-panel state-panel--error"
      role="alert"
    >
      {{ error() }}
    </p>
  } @else if (loading()) {
    <p class="state-panel">
      Chargement de l’effectif…
    </p>
  } @else {
    <app-character-roster
      [characters]="characters()"
      (characterSelected)="selectCharacter($event)"
    />
  }
</main>
