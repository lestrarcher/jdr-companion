<section class="world-controls">
  <header class="section-heading">
    <span class="eyebrow">
      État du monde
    </span>

    <h2>Temps et environnement</h2>
  </header>

  <form
    [formGroup]="worldForm"
    (ngSubmit)="submit()"
  >
    <fieldset [disabled]="disabled()">
      <div class="form-grid">
        <label>
          <span>Jour</span>

          <input
            type="number"
            min="1"
            formControlName="day"
          />
        </label>

        <label>
          <span>Moment</span>

          <select formControlName="dayPeriod">
            <option value="Aube">Aube</option>
            <option value="Matin">Matin</option>
            <option value="Midi">Midi</option>
            <option value="Après-midi">
              Après-midi
            </option>
            <option value="Crépuscule">
              Crépuscule
            </option>
            <option value="Nuit">Nuit</option>
          </select>
        </label>

        <label>
          <span>Météo</span>

          <select formControlName="weatherId">
            @for (
              weather of weatherStates();
              track weather.id
            ) {
              <option [value]="weather.id">
                {{ weather.label }}
              </option>
            }
          </select>
        </label>

        <label>
          <span>Phase lunaire</span>

          <select formControlName="moonId">
            @for (
              moon of moonPhases();
              track moon.id
            ) {
              <option [value]="moon.id">
                {{ moon.label }}
              </option>
            }
          </select>
        </label>

        <label>
          <span>Lieu actuel</span>

          <input
            type="text"
            formControlName="locationName"
            placeholder="Argynvostholt"
          />
        </label>

        <label>
          <span>Sous-lieu</span>

          <input
            type="text"
            formControlName="locationSubtitle"
            placeholder="Lisière de la forêt"
          />
        </label>
      </div>

      <button
        class="submit-button"
        type="submit"
      >
        Mettre à jour le display
      </button>
    </fieldset>
  </form>
</section>
