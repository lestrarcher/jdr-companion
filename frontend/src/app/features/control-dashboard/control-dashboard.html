<main class="control-dashboard">
  <header class="dashboard-header">
    <div>
      <span class="eyebrow">
        JDR Companion
      </span>

      <h1>
        {{ campaign.name }}

        @if (backendSession(); as session) {
          <small>— {{ session.name }}</small>
        }
      </h1>
    </div>

    <span
      class="header-status"
      [attr.data-status]="sessionStatus()"
    >
      {{ sessionStatus() }}
    </span>
  </header>

  @if (dashboardLoading()) {
    <section class="dashboard-message">
      Chargement de la session…
    </section>
  } @else if (dashboardError()) {
    <section
      class="dashboard-message dashboard-error"
      role="alert"
    >
      {{ dashboardError() }}
    </section>
  } @else {
    <div class="dashboard-layout">
      <app-session-controls
        [status]="sessionStatus()"
        [updating]="
          sessionStatusUpdateRunning()
        "
        [fogEnabled]="
          liveState()?.fogEnabled ?? false
        "
        [cinematicEnabled]="
          liveState()?.displayMode ===
          'cinematic'
        "
        [displayUrl]="displayUrl()"
        [error]="sessionStatusError()"
        (sessionOpened)="openSession()"
        (sessionClosed)="closeSession()"
        (fogToggled)="toggleFog()"
        (cinematicToggled)="
          toggleCinematicMode()
        "
        (sessionDrafted)="draftSession()"
      />

      <section class="dashboard-content">
        <app-world-controls
          [state]="liveState()"
          [weatherStates]="
            campaign.weatherStates
          "
          [moonPhases]="
            campaign.moonPhases
          "
          [disabled]="dashboardLoading()"
          (worldUpdated)="
            updateWorld($event)
          "
        />

        <app-media-controls
          [media]="campaign.media"
          [selectedMediaId]="
            liveState()
              ?.displayedMedia
              ?.id ?? null
          "
          [disabled]="dashboardLoading()"
          (mediaSelected)="
            displayMedia($event)
          "
          (mediaCleared)="clearMedia()"
        />
      </section>

      <app-session-characters
        [campaignId]="backendCampaignId"
        [sessionId]="backendSessionId"
        [characters]="
          importedCharacters()
        "
        [initializationRunning]="
          characterImportRunning()
        "
        [initializationError]="
          characterImportError()
        "
        [restRequests]="
          pendingRestRequests()
        "
        [resolvingRestRequestId]="
          resolvingRestRequestId()
        "
        [restRequestError]="
          restRequestError()
        "
        (charactersInitialized)="
          synchronizeCharacters()
        "
        (restRequestResolved)="
          resolveRestRequest(
            $event.requestId,
            $event.approved
          )
        "
      />
    </div>
  }
</main>
