<main class="control-dashboard">
  <header class="dashboard-header">
    <div>
      <span class="eyebrow">JDR Companion</span>
      <h1>{{ campaign.name }}</h1>
    </div>

    <div class="session-status">
      <span class="status-dot"></span>
      Session en préparation
    </div>
  </header>

  <section class="control-panel">
    <div class="panel-heading">
      <span class="eyebrow">État du monde</span>
      <h2>Temps et calendrier</h2>
    </div>

    <form [formGroup]="worldForm" (ngSubmit)="updateWorld()">
      <div class="form-grid">
        <label>
          <span>Jour</span>
          <input type="number" formControlName="day" min="1" />
        </label>

        <label>
          <span>Moment de la journée</span>
          <select formControlName="dayPeriod">
            <option value="Aube">Aube</option>
            <option value="Matin">Matin</option>
            <option value="Midi">Midi</option>
            <option value="Après-midi">Après-midi</option>
            <option value="Crépuscule">Crépuscule</option>
            <option value="Nuit">Nuit</option>
          </select>
        </label>

        <label>
          <span>Météo</span>

          <select formControlName="weatherId">
            @for (weather of campaign.weatherStates; track weather.id) {
              <option [value]="weather.id">
                {{ weather.label }}
              </option>
            }
          </select>
        </label>

        <label>
          <span>Phase lunaire</span>

          <select formControlName="moonId">
            @for (moon of campaign.moonPhases; track moon.id) {
              <option [value]="moon.id">
                {{ moon.label }}
              </option>
            }
          </select>
        </label>

        <label>
          <span>Lieu actuel</span>
          <input
            type="text"
            formControlName="locationName"
            placeholder="Argynvostholt"
          />
        </label>

        <label>
          <span>Sous-lieu</span>
          <input
            type="text"
            formControlName="locationSubtitle"
            placeholder="Lisière de la forêt"
          />
        </label>
      </div>

      <div class="form-actions">
        <button type="submit">Mettre à jour l’écran</button>
      </div>
    </form>
  </section>

    <section class="control-panel display-controls-panel">
  <div class="panel-heading">
    <div>
      <span class="eyebrow">Mise en scène</span>
      <h2>Affichage joueurs</h2>
    </div>
  </div>

  <div class="display-controls">
    <button
      class="mode-button"
      type="button"
      [class.mode-button-active]="liveState()?.fogEnabled"
      [attr.aria-pressed]="liveState()?.fogEnabled"
      (click)="toggleFog()"
    >
      <strong>Brouillard</strong>
      <small>
        {{ liveState()?.fogEnabled ? 'Activé' : 'Désactivé' }}
      </small>
    </button>

    <button
      class="mode-button"
      type="button"
      [class.mode-button-active]="
        liveState()?.displayMode === 'cinematic'
      "
      [attr.aria-pressed]="
        liveState()?.displayMode === 'cinematic'
      "
      (click)="toggleCinematicMode()"
    >
      <strong>Mode cinématique</strong>
      <small>
        {{
          liveState()?.displayMode === 'cinematic'
            ? 'Plein écran'
            : 'Affichage normal'
        }}
      </small>
    </button>
  </div>
</section>
  <section class="control-panel media-panel">
    <div class="panel-heading">
      <div>
        <span class="eyebrow">Écran joueurs</span>
        <h2>Médias</h2>
      </div>

      <button
        class="secondary-button"
        type="button"
        (click)="clearMedia()"
      >
        Masquer l’image
      </button>
    </div>



    <div class="media-grid">
      @for (media of campaign.media; track media.id) {
        <button
          class="media-card"
          type="button"
          [class.media-card-selected]="
            liveState()?.displayedMedia?.id === media.id
          "
          (click)="displayMedia(media)"
        >
          <span class="media-thumbnail">
            <img
              [src]="media.thumbnail ?? media.source"
              [alt]="media.alt"
              loading="lazy"
            />
          </span>

          <span class="media-information">
            <strong>{{ media.label }}</strong>

            @if (media.subtitle) {
              <small>{{ media.subtitle }}</small>
            }
          </span>

          <span class="media-fit">
            {{ media.fit ?? 'contain' }}
          </span>
        </button>
      } @empty {
        <p class="empty-state">
          Aucun média n’est encore configuré pour cette campagne.
        </p>
      }
    </div>
  </section>
</main>
