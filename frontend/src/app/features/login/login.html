<main class="login-page">
  <section class="login-card">
    <header>
      <span class="eyebrow">
        JDR Companion
      </span>

      <h1>Espace du maître du jeu</h1>

      <p>
        Connectez-vous pour préparer et
        piloter vos campagnes.
      </p>
    </header>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="submit()"
    >
      <label>
        <span>Adresse email</span>

        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="mj@example.com"
        />
      </label>

      <label>
        <span>Mot de passe</span>

        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </label>

      @if (errorMessage()) {
        <p
          class="error-message"
          role="alert"
        >
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="
          loginForm.invalid ||
          submitting()
        "
      >
        {{
          submitting()
            ? 'Connexion…'
            : 'Se connecter'
        }}
      </button>
    </form>
  </section>
</main>
