
a@if (visible()) {
  <section
    class="initiative-cinematic"
    aria-live="assertive"
  >
    <video
      class="initiative-video"
      autoplay
      muted
      playsinline
    >
      <source
        src="/videos/initiative-fog.webm"
        type="video/webm"
      />

      <source
        src="/videos/initiative-fog.mp4"
        type="video/mp4"
      />
    </video>

    <div
      class="initiative-darkness"
      aria-hidden="true"
    ></div>

    <div class="initiative-title">
      <span class="initiative-title-small">
        Lancez
      </span>

      <span class="initiative-divider">
        <span></span>
        ◆
        <span></span>
      </span>

      <strong>
        L’initiative
      </strong>
    </div>
  </section>
}
