<section
  class="initiative-cinematic"
  [class.initiative-cinematic--visible]="visible()"
  aria-live="assertive"
>
  <video
    #initiativeVideo
    class="initiative-video"
    src="/videos/initiative-fog.mp4"
    muted
    playsinline
    preload="auto"
  ></video>

  <div
    class="initiative-darkness"
    aria-hidden="true"
  ></div>

  <div class="initiative-title">
    <span class="initiative-title-small">
      Lancez
    </span>

    <span class="initiative-divider">
      <span></span>
      ◆
      <span></span>
    </span>

    <strong>
      L’initiative
    </strong>
  </div>
</section>
