<header class="world-header">
  <section class="conditions" aria-label="Conditions actuelles">
    @if (state()?.moon; as moon) {
      <div class="moon-visual">
        <img
          class="moon-image"
          [src]="moon.imageUrl"
          [alt]="moon.alt"
        />
      </div>
    }

    <span class="separator" aria-hidden="true"></span>

    @if (state()?.weather; as weather) {
      <div class="weather-visual">
        <img
          class="weather-image"
          [src]="weather.imageUrl"
          [alt]="weather.alt"
        />
      </div>
    }
  </section>

  <section class="date">
    <span class="ornament" aria-hidden="true">◆</span>

    <div>
      <span class="label">{{ campaignLabel() }}</span>
      <strong>Jour {{ state()?.day }}</strong>
      <small>{{ state()?.dayPeriod }}</small>
    </div>

    <span class="ornament" aria-hidden="true">◆</span>
  </section>

  <section class="location">
    <span class="label">Lieu actuel</span>
    <strong>{{ state()?.location?.name }}</strong>
    <small>{{ state()?.location?.subtitle }}</small>
  </section>
</header>
