<div
  class="player-screen"
  [class.player-screen--cinematic]="
    liveState()?.displayMode === 'cinematic'
  "
>
  <div class="display-layout">
    <section class="display-main">
      <app-world-header
        [campaignLabel]="campaign.worldName"
        [state]="liveState()"
      />

      <app-main-display
        [cinematic]="liveState()?.displayMode === 'cinematic'"
        [displayedMedia]="liveState()?.displayedMedia ?? null"
      />
    </section>

    <aside class="player-sidebar">
      <app-quests-panel />
      <app-memorial-panel />
    </aside>
  </div>

  <app-tip-bar />

  @if (liveState()?.fogEnabled) {
    <app-ambient-fog />
  }
</div>
