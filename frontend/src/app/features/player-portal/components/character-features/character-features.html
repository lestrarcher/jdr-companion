<section class="character-features" aria-label="Capacités du personnage">
  @for (feature of features(); track feature.slug) {
    <details class="character-feature">
      <summary class="character-feature__summary">
        <span class="character-feature__name">{{ feature.name }}</span>

        <span class="character-feature__meta">
          @if (feature.sourceName) {
            <span class="feature-tag" [class]="sourceClass(feature.sourceType)">{{ feature.sourceName }}</span>
          }

          <span class="character-feature__chevron" aria-hidden="true">⌄</span>
        </span>
      </summary>

      <div class="character-feature__content">
        <p>{{ feature.description || 'Aucune description renseignée.' }}</p>
      </div>
    </details>
  } @empty {
    <p class="character-features__empty">Aucune capacité acquise n’est renseignée pour ce personnage.</p>
  }
</section>
