@if (groups().length) {
  <div class="slot-groups" role="group" aria-label="Emplacements de sorts">
    @for (group of groups(); track group.id; let last = $last; let index = $index) {
      <div class="slot-group" [class.pact]="group.pact" [class.row-end]="(index + 1) % 5 === 0 || last"
        role="group" [attr.aria-label]="label(group)">
        <div class="heading"><strong>{{ roman(group.level) }}</strong></div>
        <div class="cells">
          @for (cell of group.cells; track cell) {
            <span class="cell" [class.full]="group.current !== null && cell < group.current"
              [class.unknown]="group.current === null" role="img"
              [attr.aria-label]="'Emplacement ' + (cell + 1) + ' : ' + (group.current === null ? 'état inconnu' : cell < group.current ? 'disponible' : 'consommé')">
              @if (group.current === null) { ? }
            </span>
          }
        </div>
        @if (group.pact) { <small class="pact-caption">Pacte</small> }
      </div>
    }
  </div>
}
